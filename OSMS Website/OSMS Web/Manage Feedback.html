    <script>
        const feedbackForm = document.getElementById('feedbackForm');
        const feedbackList = document.getElementById('feedbackList');

        // Function to add feedback to the list
        function addFeedbackToList(name, feedback) {
            const feedbackItem = document.createElement('div');
            feedbackItem.className = 'feedback-item';
            feedbackItem.innerHTML = `
                <h4>${name}</h4>
                <p>${feedback}</p>
                <div class="feedback-actions">
                    <button class="edit-btn">Edit</button>
                    <button class="delete-btn">Delete</button>
                </div>
            `;

            // Add Edit and Delete functionality
            feedbackItem.querySelector('.edit-btn').addEventListener('click', () => {
                const newFeedback = prompt("Update your feedback:", feedback);
                if (newFeedback) {
                    feedbackItem.querySelector('p').textContent = newFeedback;
                }
            });

            feedbackItem.querySelector('.delete-btn').addEventListener('click', () => {
                if (confirm("Are you sure you want to delete this feedback?")) {
                    feedbackItem.remove();
                }
            });

            feedbackList.appendChild(feedbackItem);
        }

        // Submit event for feedback form
        feedbackForm.addEventListener('submit', function(event) {
            event.preventDefault();

            const name = document.getElementById('name').value;
            const feedback = document.getElementById('feedback').value;

            // Add feedback to the list
            addFeedbackToList(name, feedback);

            // Clear the form
            feedbackForm.reset();

            // Show success message
            alert('Feedback submitted successfully!');
        });
    </script>
