<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Request for Payment Cancellation | Vision Gate Optometrist</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, #f3f9f9, #cfefff);
            margin: 0;
            padding: 0;
            color: #333;
        }

        .header {
            text-align: center;
            background: linear-gradient(45deg, #007a7f, #1cbbb4);
            padding: 20px;
            color: white;
        }

        .header h1 {
            margin: 0;
            font-size: 2rem;
        }

        .container {
            max-width: 700px;
            margin: 30px auto;
            background: white;
            border-radius: 15px;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.1);
            padding: 20px;
        }

        h2 {
            font-size: 1.5rem;
            color: #007a7f;
            margin-bottom: 20px;
        }

        label {
            font-weight: bold;
            margin-bottom: 5px;
            display: block;
            color: #555;
        }

        input, textarea, button {
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            border: 1px solid #ddd;
            border-radius: 10px;
            font-size: 14px;
            transition: all 0.3s ease;
        }

        input:focus, textarea:focus {
            border-color: #1cbbb4;
            box-shadow: 0 0 5px rgba(28, 187, 180, 0.3);
            outline: none;
        }

        textarea {
            resize: none;
        }

        button {
            background: linear-gradient(135deg, #007a7f, #1cbbb4);
            color: white;
            border: none;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: transform 0.2s ease, background 0.3s ease;
        }

        button:hover {
            transform: translateY(-3px);
            background: linear-gradient(135deg, #1cbbb4, #007a7f);
        }

        .message {
            text-align: center;
            margin: 10px 0;
            font-size: 14px;
            color: green;
        }

        .footer {
            background: #007a7f;
            color: white;
            text-align: center;
            padding: 15px;
            margin-top: 20px;
        }
    </style>
</head>
<body>

    <div class="header">
        <h1>Request for Payment Cancellation</h1>
    </div>

    <div class="container">
        <h2>Cancel Your Payment</h2>
        <form id="cancellationForm" action="cancel_payment.php" method="POST">
            <label for="name">Full Name</label>
            <input type="text" id="name" name="name" placeholder="Enter your full name" required>

            <label for="email">Email</label>
            <input type="email" id="email" name="email" placeholder="Enter your email" required>

            <label for="paymentID">Payment ID</label>
            <input type="text" id="paymentID" name="paymentID" placeholder="Enter your Payment ID" required>

            <label for="cancelReason">Reason for Cancellation</label>
            <textarea id="cancelReason" name="cancelReason" rows="4" placeholder="Explain your reason" required></textarea>

            <button type="submit">Submit Cancellation Request</button>
            <p class="message" id="cancellationMessage"></p>
        </form>
    </div>

    <div class="footer">
        <p>&copy; 2024 Vision Gate Optometrist. All rights reserved.</p>
    </div>

    <script>
        const form = document.getElementById('cancellationForm');
        const cancellationMessage = document.getElementById('cancellationMessage');

        form.addEventListener('submit', function(event) {
            event.preventDefault();

            const name = document.getElementById('name').value;
            const paymentID = document.getElementById('paymentID').value;

            // Simulate successful cancellation request
            cancellationMessage.style.color = 'green';
            cancellationMessage.textContent = `Cancellation request for Payment ID: ${paymentID} has been submitted successfully. We will contact ${name} soon.`;

            form.reset();
        });
    </script>
</body>
</html>
