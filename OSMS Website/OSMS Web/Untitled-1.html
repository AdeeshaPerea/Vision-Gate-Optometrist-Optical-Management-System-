<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Book an Exam & Request Channeling | Vision Gate Optometrist</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Poppins', sans-serif;
            margin: 0;
            padding: 0;
            background: linear-gradient(135deg, #f0f8ff, #e0f7fa);
            color: #333;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            width: 600px;
            background-color: white;
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 15px 30px rgba(0, 0, 0, 0.2);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .container:hover {
            transform: translateY(-10px);
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.3);
        }

        h1 {
            text-align: center;
            color: #00796b;
            font-size: 2rem;
            margin-bottom: 20px;
            background: linear-gradient(to right, #00796b, #004d40);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .tab-header {
            display: flex;
            justify-content: space-between;
            background: #e0f2f1;
            padding: 5px;
            border-radius: 10px;
            margin-bottom: 20px;
        }

        .tab-header button {
            flex: 1;
            padding: 15px;
            border: none;
            background: none;
            font-size: 1rem;
            font-weight: bold;
            color: #004d40;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .tab-header button.active {
            background: linear-gradient(to right, #00796b, #004d40);
            color: white;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
            transform: translateY(-2px);
        }

        .tab-header button:hover {
            background: #b2dfdb;
            color: #004d40;
        }

        .tab-content {
            display: none;
            animation: fadeIn 0.5s ease-out;
        }

        .tab-content.active {
            display: block;
        }

        label {
            font-size: 1rem;
            margin: 15px 0 5px;
            display: block;
        }

        input, select, textarea, button {
            width: 100%;
            padding: 15px;
            margin-top: 8px;
            border: 1px solid #ccc;
            border-radius: 10px;
            font-size: 1rem;
            transition: all 0.3s ease;
        }

        input:focus, select:focus, textarea:focus {
            outline: none;
            border-color: #00796b;
            box-shadow: 0 0 10px rgba(0, 121, 107, 0.5);
        }

        button {
            background-color: #00796b;
            color: white;
            font-size: 1rem;
            font-weight: bold;
            border: none;
            border-radius: 10px;
            margin-top: 20px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        button:hover {
            background-color: #004d40;
            transform: translateY(-3px);
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
        }

        .summary {
            margin-top: 20px;
            background: #e0f7fa;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
        }

        .summary-content {
            background: #ffffff;
            padding: 15px 20px;
            border-radius: 10px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
            line-height: 1.8;
            font-size: 1rem;
            color: #333;
        }

        .summary-content p {
            margin: 0;
            padding: 5px 0;
        }

        .summary-content span {
            font-weight: bold;
            color: #00796b;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @media (max-width: 768px) {
            .container {
                width: 90%;
            }

            h1 {
                font-size: 1.5rem;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Vision Gate Optometrist</h1>
        <div class="tab-header">
            <button class="active" onclick="showTab('examTab')">Book an Exam</button>
            <button onclick="showTab('channelingTab')">Request Channeling</button>
        </div>

        <div id="examTab" class="tab-content active">
            <form id="examForm"  action="process.php" method="POST">
                <label for="examType">Choose Exam Type:</label>
                <select id="examType" name="examType" required>
                    <option value="" disabled selected>Select an exam</option>
                    <option value="Eye Exam">Eye Exam</option>
                    <option value="Ear Exam">Ear Exam</option>
                </select>
                <label for="examName">Full Name:</label>
                <input type="text" id="examName" name="examName" placeholder="Enter your full name" required>
                <label for="examEmail">Email:</label>
                <input type="email" id="examEmail" name="examEmail" placeholder="Enter your email" required>
                <label for="examDate">Preferred Date:</label>
                <input type="date" id="examDate" name="examDate" required>
                <div class="summary">
                    <h2>Exam Summary:</h2>
                    <div id="examSummary" class="summary-content">
                        <p>Details will appear here...</p>
                    </div>
                </div>
                <button type="button" onclick="generateExamSummary()">Generate Exam Summary</button>
                <button type="button" onclick="downloadExamSummary()">Download Exam Summary</button>
            </form>
        </div>

        <div id="channelingTab" class="tab-content">
            <form id="channelingForm" action="process.php" method="POST">
                <label for="channelName">Full Name:</label>
                <input type="text" id="channelName" name="channelName" placeholder="Enter your full name" required>
                <label for="channelDoctor">Select Doctor:</label>
                <select id="channelDoctor" name="channelDoctor" required>
                    <option value="" disabled selected>Choose a doctor</option>
                    <option value="Dr. John Doe">Dr. John Doe</option>
                    <option value="Dr. Jane Smith">Dr. Jane Smith</option>
                </select>
                <label for="channelDate">Preferred Date:</label>
                <input type="date" id="channelDate" name="channelDate" required>
                <label for="channelAmount">Payment Amount:</label>
                <input type="number" id="channelAmount" name="channelAmount" required>
                <div class="summary">
                    <h2>Channeling Summary:</h2>
                    <div id="channelSummary" class="summary-content">
                        <p>Details will appear here...</p>
                    </div>
                </div>
                <button type="button" onclick="generateChannelSummary()">Generate Channeling Summary</button>
                <button type="button" onclick="downloadChannelSummary()">Download Channeling Summary</button>
            </form>
        </div>
    </div>

    <script>
        function showTab(tabId) {
            document.querySelectorAll('.tab-content').forEach(tab => tab.classList.remove('active'));
            document.querySelectorAll('.tab-header button').forEach(button => button.classList.remove('active'));
            document.getElementById(tabId).classList.add('active');
            document.querySelector(`[onclick="showTab('${tabId}')"]`).classList.add('active');
        }

        function generateExamSummary() {
            const examType = document.getElementById('examType').value || "Not selected";
            const examName = document.getElementById('examName').value || "Not provided";
            const examEmail = document.getElementById('examEmail').value || "Not provided";
            const examDate = document.getElementById('examDate').value || "Not selected";

            const summaryContent = `
                <p><span>Exam Type:</span> ${examType}</p>
                <p><span>Full Name:</span> ${examName}</p>
                <p><span>Email Address:</span> ${examEmail}</p>
                <p><span>Preferred Date:</span> ${examDate}</p>
            `;

            document.getElementById('examSummary').innerHTML = summaryContent;
        }

        function generateChannelSummary() {
            const channelName = document.getElementById('channelName').value || "Not provided";
            const channelDoctor = document.getElementById('channelDoctor').value || "Not selected";
            const channelDate = document.getElementById('channelDate').value || "Not selected";
            const channelAmount = document.getElementById('channelAmount').value || "Not provided";

            const summaryContent = `
                <p><span>Patient Name:</span> ${channelName}</p>
                <p><span>Doctor:</span> ${channelDoctor}</p>
                <p><span>Date:</span> ${channelDate}</p>
                <p><span>Payment:</span> $${channelAmount}</p>
            `;

            document.getElementById('channelSummary').innerHTML = summaryContent;
        }

        function downloadExamSummary() {
            const { jsPDF } = window.jspdf;
            const doc = new jsPDF();
            const summary = document.getElementById('examSummary').innerText;

            const lines = doc.splitTextToSize(summary, 180);
            doc.text("Vision Gate Optometrist - Exam Summary", 10, 10);
            doc.text(lines, 10, 20);
            doc.save('Exam_Summary.pdf');
        }

        function downloadChannelSummary() {
            const { jsPDF } = window.jspdf;
            const doc = new jsPDF();
            const summary = document.getElementById('channelSummary').innerText;

            const lines = doc.splitTextToSize(summary, 180);
            doc.text("Vision Gate Optometrist - Channeling Summary", 10, 10);
            doc.text(lines, 10, 20);
            doc.save('Channeling_Summary.pdf');
        }
    </script>
</body>
</html>
