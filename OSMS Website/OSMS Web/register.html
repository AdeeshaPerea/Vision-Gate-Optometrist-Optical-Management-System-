<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Patient Registration | Vision Gate Optometrist</title>
    <style>
        body {
            font-family: 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #0a959d, #1cbbb4);
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .container {
            width: 400px;
            padding: 30px;
            background-color: white;
            border-radius: 15px;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.2);
            text-align: center;
            animation: fadeIn 1s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        h1 {
            color: #0a959d;
            font-size: 24px;
            margin-bottom: 20px;
        }

        img {
            width: 100px;
            border-radius: 50%;
            margin-bottom: 15px;
        }

        input, button {
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            border: 1px solid #ddd;
            border-radius: 10px;
            font-size: 14px;
            transition: all 0.3s ease;
        }

        input:focus {
            outline: none;
            border-color: #1cbbb4;
            box-shadow: 0 0 8px rgba(28, 187, 180, 0.3);
        }

        button {
            background: linear-gradient(135deg, #0a959d, #1cbbb4);
            color: white;
            border: none;
            font-size: 16px;
            cursor: pointer;
            font-weight: bold;
            transition: background 0.3s ease, transform 0.2s ease;
        }

        button:hover {
            background: linear-gradient(135deg, #1cbbb4, #0a959d);
            transform: translateY(-2px);
            box-shadow: 0 6px 12px rgba(28, 187, 180, 0.3);
        }

        .back-button {
            background-color: #ddd;
            color: #555;
            margin-top: 10px;
        }

        .back-button:hover {
            background-color: #bbb;
            transform: translateY(-2px);
        }

        .message {
            color: #0a959d;
            margin-top: 10px;
            font-size: 14px;
        }

        .age {
            font-size: 18px;
            color: #fff;
            margin-top: 15px;
            font-weight: 600;
            background: #1cbbb4;
            padding: 10px 20px;
            border-radius: 30px;
            display: inline-block;
            width: auto;
            box-shadow: 0 6px 12px rgba(0, 0, 0, 0.15);
            text-align: center;
        }
    </style>
</head>
<body>

    <div class="container">
        <img src="Medicine_Doctor.png" alt="Customer Image"> <!-- Replace with your image -->
        <h1>Patient Register</h1>
        <form id="registrationForm" action="register.php" method="POST">
            <label for="fullName">Full Name:</label>
            <input type="text" id="fullName" name="fullName" placeholder="Enter your full name" required>

            <label for="email">Email:</label>
            <input type="email" id="email" name="email" placeholder="Enter your email" required>

            <label for="DOB">Date of Birth:</label>
            <input type="date" id="DOB" name="DOB" required onchange="calculateAge()">

            <label for="age">Age:</label>
            <input type="text" id="age" name="age" placeholder="Your age will appear here" readonly>

            <label for="phone">Phone Number:</label>
            <input type="tel" id="phone" name="phone" placeholder="Enter your phone number" required pattern="[\+]?[0-9]{1,4}?[0-9]{1,15}" title="Phone number should be a valid format.">

            <label for="Address">Address:</label>
            <input type="text" id="Address" name="Address" placeholder="Enter your full Address" required>

            <button type="submit">Register Now</button>
            <p class="message" id="successMessage"></p>
        </form>

        <button class="back-button" onclick="goBack()">Back to Main Page 🔙</button>
    </div>

    <script>
        const form = document.getElementById('registrationForm');
        const successMessage = document.getElementById('successMessage');

        form.addEventListener('submit', function(event) {
            event.preventDefault();
            successMessage.textContent = "Registration successful! 🎉 Welcome to Vision Gate.";
        });

            function goBack() {
            window.location.href = 'homePage.html'; // Replace with your main page URL
        }

        function calculateAge() {
            const dob = document.getElementById('DOB').value;
            if (dob) {
                const birthDate = new Date(dob);
                const today = new Date();
                let age = today.getFullYear() - birthDate.getFullYear();
                const m = today.getMonth() - birthDate.getMonth();
                if (m < 0 || (m === 0 && today.getDate() < birthDate.getDate())) {
                    age--;
                }
                document.getElementById('age').value = age;  // Automatically set the age in the text field
            }
        }
    </script>


</body>
</html>
